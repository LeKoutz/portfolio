{{define "projects"}}
<div class="projects">
    <h2 class="projects__heading">Projects</h2>
    <form method="GET" class="search js-search" action="/projects">
        <input class="search__input js-query"
            name="q"
            placeholder="Search name, language, tool..."
            {{if .SearchQuery}}value="{{.SearchQuery}}"{{end}}>
        <div class="search__actions">
            <button class="search__clear js-search-clear" type="button">X</button>
            <button class="search__btn" type="submit">Search</button>
        </div>
    </form>
    <div class="project__cards js-projects">
        {{range .Projects}}
        {{template "project-card" .}}
        {{end}}
    </div>
</div>
{{end}}
