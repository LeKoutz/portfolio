{{define "projects"}}
<div id="projects-section" class="section">
    <h2>Projects</h2>
    <form method="GET" id="search" class="search-bar" action="/projects">
        <input id="query"
            name="q"
            placeholder="Search by project name, language, tool..."
            {{if .SearchQuery}}
            value="{{.SearchQuery}}"
            {{else}}
            value=""
            {{end}}>
        <div class="search-actions">
            <button class="clear-button" type="button">X</button>
            <button type="submit">Search</button>
        </div>
    </form>
    <div class="projects">
        {{range .Projects}}
        {{template "project-card" .}}
        {{end}}
    </div>
</div>
{{end}}
